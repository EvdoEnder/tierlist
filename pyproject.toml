[project]
name = "tierlist"
version = "0.1.0"
description = "Daily early-signal radar for new open-source projects"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.2",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["intel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_calibration: run with the real model-version lookup and calibration, not the offline stubs",
    "real_translate: run the real translation call (against a mock transport), not the offline stub",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
