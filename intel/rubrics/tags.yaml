# The controlled tag vocabulary.
#
# A tag exists to gather projects together. Before this file the model was
# told "短中文主题词或小写英文技术词" and invented a fresh word per project:
# 266 tags over 114 items, 229 of them used exactly once, and all 17 `crack`
# items also carried `破解` because either language was allowed. A tag that
# names one project gathers nothing.
#
# Two tiers, because the two failures have different cures:
#
#   topics   — CLOSED. The model picks 2-4 of these and may not invent one.
#              This is what clusters, so this is what must be finite.
#   entities — OPEN, at most 2. Proper nouns: products, protocols, games,
#              formats (valorant, ffmpeg, x64dbg). A singleton here is
#              correct — /tags/valorant.html is meant to hold one project —
#              and closing this tier would break the one lookup readers
#              actually perform.
#
# Slugs are ASCII and are both the filename and the URL. `zh`/`en` are
# display only, so /tags/crack.html reads 破解 on the Chinese site and Crack
# on the English one instead of shipping Chinese tags onto English pages.
#
# NOT in the vocabulary, deliberately:
#   * Programming languages. Every entry already prints the repo's language
#     beside its stars (`★569 · Zig`), so a `rust` tag is a second copy of a
#     field the reader is already looking at.
#   * Anything a rubric dimension already scores.
#
# `aliases` maps what the model actually emitted — including both halves of
# every bilingual pair — onto a slug. It is the model's spell-checker, and a
# `null` target means "drop this, it carries no signal" (开源, 源码, meta).

version: 1

# A `group` row starts a heading on the tag index (/tags/); every topic
# below it belongs to that group until the next one. Groups are display
# only: the model is shown the topics, never the groups.
